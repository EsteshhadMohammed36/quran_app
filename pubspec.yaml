name: quran_app
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter


  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.6

  # --- Section 17: Flutter Architecture (state management) ---
  # App-wide state (QuranReaderProvider, TafsirProvider, AudioProvider,
  # UserLibraryProvider per Section 17.1).
  provider: ^6.1.1

  # --- Section 15: Local Database Strategy (SQLite) ---
  # Local SQLite for query-heavy Quran study data (layout, script, tafsir,
  # morphology, audio segments, bookmarks, notes, reading state).
  sqflite: ^2.3.2
  # Resolves per-platform app storage locations for the SQLite DB file and
  # bundled/downloaded assets (fonts, audio, resource packages).
  path_provider: ^2.1.2
  # Companion to sqflite for building the on-device database file path.
  path: ^1.9.0

# path_provider_android is a transitive dep (via path_provider) — pub's
# solver isn't guaranteed to re-pick the same version across resolutions,
# and 2.2.4 (in this environment's local pub cache) still ships the v1
# Android embedding's PluginRegistry.Registrar API, which this Flutter SDK
# has removed entirely, breaking the Gradle build. Pinning here forces the
# known-good version regardless of what a future `pub get` would otherwise
# pick (2026-08-31, fixing a build break introduced by an incidental
# `flutter analyze`-triggered re-resolution, unrelated to any app code).
dependency_overrides:
  path_provider_android: 2.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^3.0.0
  archive: ^4.2.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # --- Section 23: Data Ingestion Pipeline ---
  # Pre-built, pre-populated SQLite database (surahs/ayahs/words/mushaf_lines
  # + resource_manifest) produced by `tool/ingest_quran_data.dart` from the
  # QUL resources in raw_resources/. AppDatabase copies this to the app's
  # documents directory on first run instead of ingesting on-device.
  assets:
    - assets/database/quran.db

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # --- Section 7/25: Mandatory Prototype fonts ---
  # QPC V2 is a page-specific font: every Mushaf page has its own font file
  # and its own family name, read from each file's actual 'name' table
  # (spec section7: "use the exact family names included with the
  # downloaded font package rather than hard-code a guessed family") - not
  # guessed. Only the 4 prototype pages (section25) are bundled so far;
  # do not add more until the prototype is validated (rule #5).
  fonts:
    - family: QCF2001
      fonts:
        - asset: assets/fonts/qpc_v2/p1.ttf
    - family: QCF2300
      fonts:
        - asset: assets/fonts/qpc_v2/p300.ttf
    - family: QCF2601
      fonts:
        - asset: assets/fonts/qpc_v2/p601.ttf
    - family: QCF2604
      fonts:
        - asset: assets/fonts/qpc_v2/p604.ttf
    # Dedicated QUL font for surah_name lines: one decorative ligature
    # glyph per surah (verified via its cmap+glyf tables, not guessed).
    # Regular Arabic text can't be rendered through the QCFxxx page fonts
    # above — they only map presentation-form codepoints, not letters.
    - family: QCF_SurahHeader_COLOR
      fonts:
        - asset: assets/fonts/surah_header/QCF_SurahHeader_COLOR-Regular.ttf
