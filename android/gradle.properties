org.gradle.jvmargs=-Xmx4G
android.useAndroidX=true
android.enableJetifier=true
# Disables Kotlin's incremental-compilation cache. On this machine the repo
# lives on D: while the pub cache (where plugin sources like audio_session,
# pulled in by just_audio for Prompt 13/spec §14, live) is on C: — the
# incremental compiler's relocatable-cache logic calls File.relativeTo()
# between the two, which throws IllegalArgumentException("this and base
# files have different roots") on Windows when the paths are on different
# drive letters, always failing :audio_session:compileDebugKotlin. A
# non-incremental build has no such cache to relocate, so it isn't affected
# by this Windows/Kotlin bug. Not an app-code issue — a build-tooling
# workaround for this environment (2026-09-14).
kotlin.incremental=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
